[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "costpilot"
version = "0.1.0"
description = "Routing por custo por tarefa resolvida, com orçamento atómico e cascata de escalonamento."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.165.0",
    "pydantic==2.14.4",
    "pydantic-settings==2.16.3",
    "httpx==0.28.1",
    "redis==8.1.0",
    "sqlalchemy==2.1.9",
    "alembic==1.20.1",
    "pyyaml==6.0.3",
    "uvicorn==0.54.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.2.0",
    "fakeredis==2.40.0",
    "lupa==2.8",
    "ruff==0.17.6",
]

[tool.setuptools]
py-modules = []

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".venv", "frontend/node_modules"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]
addopts = "-ra"
markers = [
    "redis: precisa de um servidor Redis real (COSTPILOT_TEST_REDIS_URL); ignorado quando não está acessível",
]
